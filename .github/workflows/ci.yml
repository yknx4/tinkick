name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "4.0"
            rails: "~> 8.0.0"
            json: "< 3"
          - ruby: "4.0"
            rails: "~> 8.1.0"
            json: "< 3"
    env:
      RAILS_VERSION: ${{ matrix.rails }}
      JSON_VERSION: ${{ matrix.json }}
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: tinkick-ci-only
      PGSSLMODE: disable
      TINKICK_TEST_BACKEND: lead
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build PostgreSQL with Lead
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker/lead
          load: true
          tags: tinkick-lead:ci
          cache-from: type=gha,scope=postgres-lead
          cache-to: type=gha,mode=max,scope=postgres-lead
      - name: Start isolated test database
        run: docker compose -f docker/lead/compose.yml up --detach --wait --wait-timeout 60
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rbs collection install
      - run: bundle exec rake rbs:format
      - run: git diff --exit-code -- sig
      - run: bundle exec rake
      - run: bundle exec rake build
      - name: Database logs on failure
        if: failure()
        run: docker compose -f docker/lead/compose.yml logs --no-color
      - name: Remove test database
        if: always()
        run: docker compose -f docker/lead/compose.yml down --volumes
